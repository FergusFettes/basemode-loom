name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a tagged release after its checks pass"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_version:
        description: >-
          Version another workflow has already committed and wants released.
          Must match pyproject.toml at `ref`, which is checked rather than
          trusted. Supplying it is what marks a run as delegated: a reusable
          workflow sees the caller's event, so it cannot recognise itself.
        required: true
        type: string
      ref:
        description: >-
          Commit to release. A caller that has just pushed must name its own
          commit; the default checkout would be the SHA that started the run,
          which predates the push.
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Decide what this run should do
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -eo pipefail
          version="$(uv version --short)"
          build=false
          publish=false
          tag=false

          if [ -n "${RELEASE_VERSION}" ]; then
            # Delegated by another workflow, which has already pushed the
            # release commit. It cannot tag first: a tag pushed with the
            # default token starts no run, so tagging is this workflow's job
            # and happens only once the checks below have passed.
            if [ "${RELEASE_VERSION}" != "${version}" ]; then
              echo "Caller asked for ${RELEASE_VERSION}, but the checked-out" \
                   "commit is ${version}." >&2
              exit 1
            fi
            build=true
            publish=true
            tag=true
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # An explicit tag push releases exactly what the tag points at.
            build=true
            publish=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual runs exercise the build. Publishing is allowed only when
            # the package version is already represented by a tag that is an
            # ancestor of the checked-out commit, which makes recovery of a
            # failed release safe after a workflow-only fix.
            build=true
            if [ "${{ inputs.publish }}" = "true" ]; then
              tag_commit="$(git rev-list -n 1 "v${version}" 2>/dev/null || true)"
              if [ -z "${tag_commit}" ] || ! git merge-base --is-ancestor "${tag_commit}" "${GITHUB_SHA}"; then
                echo "Manual publishing requires v${version} to be an ancestor of the current commit." >&2
                exit 1
              fi
              publish=true
            fi
          else
            # A push to the default branch releases only when the version
            # actually changed in that push, so ordinary merges do nothing.
            previous=""
            if [ -n "${BEFORE}" ] && \
               git cat-file -e "${BEFORE}:pyproject.toml" 2>/dev/null; then
              previous="$(git show "${BEFORE}:pyproject.toml" \
                | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
            fi

            if [ -z "${previous}" ]; then
              echo "No comparable previous version; not releasing."
            elif [ "${previous}" = "${version}" ]; then
              echo "Version unchanged at ${version}; not releasing."
            elif git ls-remote --exit-code --tags origin \
                 "refs/tags/v${version}" >/dev/null 2>&1; then
              # Guard against re-running a merge whose release already shipped.
              echo "v${version} is already tagged; not releasing again."
            else
              echo "Version bumped ${previous} -> ${version}; releasing."
              build=true
              publish=true
              tag=true
            fi
          fi

          {
            echo "version=${version}"
            echo "build=${build}"
            echo "publish=${publish}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          }

      - name: Run release checks
        run: make release-check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Tag the release
        if: needs.plan.outputs.tag == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "basemode-loom ${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: >-
          uv publish
          --check-url https://pypi.org/simple
          dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          gh release create "v${VERSION}"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "basemode-loom ${VERSION}"
          --generate-notes
