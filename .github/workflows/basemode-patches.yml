name: Check for Basemode patches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 6"

concurrency:
  group: basemode-patch-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.loom.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read latest Basemode release
        id: basemode
        shell: bash
        run: |
          version="$({ curl --fail --silent --show-error --retry 3 \
            https://pypi.org/pypi/basemode/json; } | \
            python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update minimum Basemode version
        run: uv add "basemode>=${{ steps.basemode.outputs.version }}"

      - name: Detect dependency change
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Basemode is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Loom patch version
        if: steps.changes.outputs.changed == 'true'
        id: loom
        shell: bash
        run: |
          uv version --bump patch
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        if: steps.changes.outputs.changed == 'true'
        env:
          BASEMODE_VERSION: ${{ steps.basemode.outputs.version }}
          LOOM_VERSION: ${{ steps.loom.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          path = Path("CHANGELOG.md")
          marker = "## Unreleased\n"
          text = path.read_text()
          if marker not in text:
              raise SystemExit("CHANGELOG.md has no Unreleased section")
          prefix, tail = text.split(marker, 1)
          boundary = tail.find("\n## ")
          if boundary < 0:
              raise SystemExit("CHANGELOG.md has no prior release section")
          unreleased = tail[:boundary].strip()
          history = tail[boundary:]
          sections = [unreleased] if unreleased else []
          sections.append(
              "### Changed\n\n"
              f"- Require Basemode {os.environ['BASEMODE_VERSION']} or newer."
          )
          release = (
              f"\n## {os.environ['LOOM_VERSION']} - {date.today().isoformat()}\n\n"
              + "\n\n".join(sections)
          )
          path.write_text(prefix + marker + release + history)
          PY

      - name: Run release checks
        if: steps.changes.outputs.changed == 'true'
        run: |
          uv sync --locked --group dev
          make release-check

      - name: Push the release commit
        if: steps.changes.outputs.changed == 'true'
        id: push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "Release ${{ steps.loom.outputs.version }}"
          git push origin \
            HEAD:${{ github.event.repository.default_branch }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # This push is authenticated with the default token, and GitHub starts no
  # workflow run from such an event, so Release would never see the commit or a
  # tag pushed beside it. Calling it as a reusable workflow runs it inside this
  # run instead, where that restriction does not apply, and leaves one copy of
  # the release logic. It tags the commit itself once its checks pass.
  release:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      release_version: ${{ needs.update.outputs.version }}
      ref: ${{ needs.update.outputs.sha }}
