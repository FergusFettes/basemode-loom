name: Check for Basemode patches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 6"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Read latest Basemode release
        id: basemode
        shell: bash
        run: |
          version="$({ curl --fail --silent --show-error --retry 3 \
            https://pypi.org/pypi/basemode/json; } | \
            python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update minimum Basemode version
        run: uv add "basemode>=${{ steps.basemode.outputs.version }}"

      - name: Run core checks
        run: |
          uv sync --group dev
          make lint-core
          make test-core

      - name: Commit dependency update
        shell: bash
        run: |
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "Basemode is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(deps): require basemode ${{ steps.basemode.outputs.version }}"
          git push
