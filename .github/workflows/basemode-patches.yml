name: Check for Basemode patches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 6"

concurrency:
  group: basemode-patch-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Read latest Basemode release
        id: basemode
        shell: bash
        run: |
          version="$({ curl --fail --silent --show-error --retry 3 \
            https://pypi.org/pypi/basemode/json; } | \
            python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update minimum Basemode version
        run: uv add "basemode>=${{ steps.basemode.outputs.version }}"

      - name: Detect dependency change
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Basemode is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Loom patch version
        if: steps.changes.outputs.changed == 'true'
        id: loom
        shell: bash
        run: |
          uv version --bump patch
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        if: steps.changes.outputs.changed == 'true'
        env:
          BASEMODE_VERSION: ${{ steps.basemode.outputs.version }}
          LOOM_VERSION: ${{ steps.loom.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          path = Path("CHANGELOG.md")
          marker = "## Unreleased\n"
          text = path.read_text()
          if marker not in text:
              raise SystemExit("CHANGELOG.md has no Unreleased section")
          prefix, tail = text.split(marker, 1)
          boundary = tail.find("\n## ")
          if boundary < 0:
              raise SystemExit("CHANGELOG.md has no prior release section")
          unreleased = tail[:boundary].strip()
          history = tail[boundary:]
          sections = [unreleased] if unreleased else []
          sections.append(
              "### Changed\n\n"
              f"- Require Basemode {os.environ['BASEMODE_VERSION']} or newer."
          )
          release = (
              f"\n## {os.environ['LOOM_VERSION']} - {date.today().isoformat()}\n\n"
              + "\n\n".join(sections)
          )
          path.write_text(prefix + marker + release + history)
          PY

      - name: Run release checks
        if: steps.changes.outputs.changed == 'true'
        run: |
          uv sync --group dev
          make release-check

      - name: Prepare release commit and tag
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "Release ${{ steps.loom.outputs.version }}"
          git tag -a "v${{ steps.loom.outputs.version }}" \
            -m "basemode-loom ${{ steps.loom.outputs.version }}"

      - name: Publish to PyPI
        if: steps.changes.outputs.changed == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish dist/*

      - name: Push release commit and tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push --atomic origin \
            HEAD:${{ github.event.repository.default_branch }} \
            "v${{ steps.loom.outputs.version }}"

      - name: Create GitHub release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.loom.outputs.version }}" \
            --title "basemode-loom ${{ steps.loom.outputs.version }}" \
            --generate-notes
